openapi: 3.0.4
info:
  title: Inflation Rate
  description: >-
    Inflation Rate reports annual inflation rates and Consumer Price Index (CPI)
    values for any country by two-letter country code. Outputs include the
    year-over-year price change percentage, CPI index, and base comparison year,
    with paid plans supporting historical lookups by year. On paid plans,
    changes=true adds the prior year's rate and the change from it, plus the
    5-year average, high, low and cumulative CPI rise.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/inflation:
    get:
      summary: Inflation Rate
      description: >-
        Get the annual inflation rate and CPI data for a specific country and
        year, optionally with the prior year's rate, the change from it and
        5-year averages and ranges.
      operationId: inflation
      parameters:
        - name: country
          in: query
          schema:
            type: string
          required: true
          description: ISO 2-letter country code (e.g., US, GB, JP, DE, BR)
          example: US
        - name: year
          in: query
          schema:
            type: integer
          required: false
          description: The year to retrieve data for. Defaults to the previous year.
          example: 2023
        - name: changes
          in: query
          schema:
            type: boolean
          required: false
          description: >-
            Include the previous year's rate, the change from it, and the 5-year
            average, high, low and CPI rise
          example: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  country: US
                  countryName: United States
                  year: 2023
                  inflationRate: 4.12
                  cpiIndex: 139.74
                  cpiBaseYear: 2010
                  lastUpdated: '2026-11-06T04:00:00.000Z'
                  previousYear: 2022
                  previousInflationRate: 8
                  inflationRateChange: -3.88
                  changeDirection: down
                  averageInflationRate5y: 3.97
                  highInflationRate5y: 8
                  lowInflationRate5y: 1.23
                  cpiChange5y: 21.34
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
